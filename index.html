{id:'q11',level:'advanced',topic:'透析用藥',branch:'special',stem:'血液透析成人考慮venlafaxine XR，所引仿單的正確原則是？',options:['直接套用一般高劑量','透析後一律補足原日劑量','總日劑量減少至少50%，核對製劑並個別化','腎功能完全不影響劑量'],answer:2,explain:'血液透析或CrCl<30者，所引XR仿單建議總日劑量減少至少50%；不可自行套用一般劑量或補量。',refs:[9]},
{id:'q12',level:'advanced',topic:'肝功能調整',branch:'special',stem:'成人Child-Pugh A（5–6分），考慮sertraline。何者符合所引仿單？',options:['由200mg直接開始','只調整最高劑量、不調整起始','輕度與重度肝病原則相同','起始與治療範圍均採一般劑量一半'],answer:3,explain:'輕度肝病採一般起始與治療範圍一半；中重度肝病不建議使用，須由專科另行規劃。',refs:[7]},
{id:'q13',level:'advanced',topic:'惡夢與低血壓',branch:'medication',stem:'透析病人反覆惡夢、血壓低且站立頭暈，關於prazosin最適切的是？',options:['立即高劑量起始','先評估低血壓、跌倒及交互作用，不自動推薦','可取代全部PTSD核心治療','不用追蹤血壓'],answer:1,explain:'Prazosin只討論PTSD相關惡夢，不是整體PTSD單方；首劑暈厥及姿勢性低血壓風險須審慎評估。',refs:[1,6]},
{id:'q14',level:'advanced',topic:'雙相疑慮',branch:'special',stem:'病人曾有睡很少仍精力旺盛、活動明顯增加的發作，現在希望先用抗憂鬱劑。下一步是？',options:['忽略既往發作，直接單方加至最高劑量','PCL-5高分可排除雙相','先評估躁症／輕躁症及雙相疑慮，轉精神科規劃','所有失眠都直接確診躁症'],answer:2,explain:'既往發作須完整評估；有雙相風險不能直接套用抗憂鬱劑單方，應先處理鑑別及情緒穩定。',refs:[6]},
{id:'q15',level:'advanced',topic:'兒少照護',branch:'special',stem:'15歲青少年創傷症狀持續3個月，最適切的照護原則是？',options:['照搬成人量表界線與處方','直接用成人最高劑量','不需評估受暴或照顧者支持','兒少專科評估、保護需求及年齡適切創傷焦點治療'],answer:3,explain:'使用年齡適切評估及家庭支持；NICE不建議以藥物預防或治療未滿18歲者的PTSD。',refs:[2]},
{id:'q16',level:'advanced',topic:'延遲症狀',branch:'early',stem:'創傷在8個月前，最近兩週才出現症狀。哪個說法最正確？',options:['釐清延遲出現、新事件及其他原因，不單憑症狀短診斷ASD','必定是ASD','事件超過一個月就可忽略症狀時間','一定與原創傷無關'],answer:0,explain:'事件與症狀時間不同；ASD與創傷後近期時窗相關。PTSD仍須症狀超過1個月及其餘條件。',refs:[1,3]},
{id:'q17',level:'advanced',topic:'安全優先',branch:'followup',stem:'PCL-5從50降至35，但本次出現明確自傷意圖，應如何決策？',options:['下降15分，宣布治癒','先啟動緊急安全評估，不以改善抵銷危險','只看分數即可延長回診間隔','自行停光所有藥物'],answer:1,explain:'下降至少10分可作反應訊號，不等同緩解，更不能抵銷急迫危險；安全與功能須另行評估。',refs:[1,4]},
{id:'q18',level:'advanced',topic:'反應不佳',branch:'followup',stem:'治療8週改善有限，但服藥不規則、心理治療多次缺席。最適切的下一步是？',options:['判定所有實證療法無效','自動疊加抗精神病藥','核對障礙、依從性、足夠劑量與療程品質，再共同調整','依單次分數永久停藥'],answer:2,explain:'先確認充分治療，處理可近性、副作用等障礙。8週為本工具回顧提醒，非所有療法固定失敗門檻。',refs:[1]},
{id:'q19',level:'advanced',topic:'物質使用共病',branch:'special',stem:'PTSD合併酒精使用障礙，沒有急性中毒或戒斷。關於創傷治療何者適切？',options:['永久排除創傷焦點治療','只處理酒精，永不再評估PTSD','完全忽略酒精風險','協同評估及照護，不因共病一概排除實證治療'],answer:3,explain:'共病納入整合照護；若出現急性中毒、戒斷或無法確保安全，先處理急迫問題。',refs:[1,5]},

function grade(answers){const missing=questions.map((q,i)=>Number.isInteger(answers[i])&&answers[i]>=0&&answers[i]<q.options.length?-1:i).filter(i=>i>=0),correct=questions.filter((q,i)=>answers[i]===q.answer).length;return {complete:!missing.length,answered:questions.length-missing.length,missing,correct,percent:missing.length?null:Math.round(correct/questions.length*100)};}

const select=(key,label,xs,help='')=>`<div class="field"><label for="${key}">${label}</label><select id="${key}" data-field="${key}">${options(xs,s[key])}</select>${help?`<small>${help}</small>`:''}</div>`;

function diagnosis(){const d=E.diagnose(s);let k=0;return `<section class="panel"><h2>診斷評估</h2><p class="intro">先確認創傷條件，再逐項檢視症狀與功能。</p>${['urgent','priority','child'].includes(d.code)?callout(d.tone,d.title,d.text):''}${select('exposure','A｜是否符合創傷暴露條件？',[['','尚未評估'],['yes','臨床評估符合'],['no','不符合'],['unknown','尚待釐清']],'涉及實際／威脅死亡、嚴重傷害或性暴力；可為親身經歷、現場目睹、得知親近者遭暴力／意外，或職務反覆接觸。一般媒體觀看不構成，除非與工作相關。')}<p class="note">以下為診斷條件的簡要提示，不是經驗證的中文量表。須確認與相關創傷有關，且在事件後出現或惡化。[3]</p><div class="symptoms">${E.groups.map(g=>`<fieldset><legend><b>${g.key}</b> ${g.title} <small>至少${g.min}項</small></legend>${g.items.map(t=>{const i=k++;return `<div class="symptom-row"><label for="sym-${i}">${t}</label><select id="sym-${i}" data-symptom="${i}">${options([['','未評估'],['yes','有'],['no','無']],s.symptoms[i])}</select></div>`;}).join('')}</fieldset>`).join('')}</div><div class="form-grid">${select('impairment','G｜明顯痛苦或功能受損',yesno)}${select('excluded','H｜已排除物質／藥物／身體疾病解釋？',yesno)}${input('pcl','正式 PCL-5 總分（選填）','number','min="0" max="80" step="1"','0–80分。請從正式量表取得，不由上方有／無症狀推算。')}</div><p class="note"><a href="https://www.ptsd.va.gov/professional/assessment/adult-sr/ptsd-checklist.asp" target="_blank" rel="noopener">正式 PCL-5 與計分說明 ↗</a>　31–33分僅作可能PTSD的篩檢參考，須依族群調整；低分也不能單獨排除。回顧期間應固定。[4]</p>${callout(d.tone,d.title,d.text)}${d.clusters?`<div class="cluster-strip">${d.clusters.map(g=>`<div><span>${g.key} ${g.title}</span><strong>${g.count}<small> / 至少${g.min}</small></strong>${g.missing?`<small>尚缺${g.missing}項</small>`:''}</div>`).join('')}</div>`:''}<label class="check-row"><input id="confirmed" data-field="confirmed" type="checkbox" ${s.confirmed?'checked':''}>醫師已完成臨床訪談並確認診斷（含鑑別診斷）</label><details><summary>鑑別診斷與共病檢視</summary><p>評估憂鬱、恐慌／焦慮、哀傷、適應障礙、雙相、精神病、物質使用、腦傷與睡眠呼吸中止。症狀計數不能取代訪談，必要時使用CAPS-5。持續解離、情緒調節及人際困難須進一步評估ICD-11複雜性PTSD，不能由一般PTSD問卷直接推定。</p></details>${next(2,'下一步：共同選擇治療')}</section>`;}
function therapy(){const p=E.plan(s),d=p.diagnosis;return `<section class="panel"><h2>治療選擇</h2><p class="intro">結合診斷、偏好、可近性及身體共病，共同決定。</p>${callout(d.tone,d.title,d.text)}<div class="form-grid">${select('preference','病人目前偏好',[['','請先共同討論'],['therapy','優先心理治療'],['med','優先討論藥物'],['combined','討論心理與藥物並用'],['undecided','尚未決定']])}${select('access','可取得受訓心理治療師？',yesno)}${select('prior','既往治療經驗',[['','未確認'],['new','尚未接受實證治療'],['partial','部分反應／療程未足'],['failed','充分療程仍反應不佳']])}${input('goal','共同治療目標（選填）','text','maxlength="120" placeholder="例如：能再次搭車回診"','請勿輸入姓名、病歷號或識別個資。')}</div><h3>共病與治療需求</h3><div class="check-grid">${[['depression','憂鬱／焦慮'],['substance','酒精／物質使用'],['dissociation','明顯解離／複雜創傷'],['sleep','失眠／疑似睡眠呼吸中止']].map(([v,t])=>`<label class="check-row"><input type="checkbox" data-comorbid="${v}" ${s.comorbid.includes(v)?'checked':''}>${t}</label>`).join('')}</div><h3>個別化治療方向</h3>${list(p.psych)}<details><summary>CPT、PE、EMDR 如何共同選擇？</summary><div class="table-wrap"><table><thead><tr><th>模式</th><th>主要工作</th><th>討論重點</th></tr></thead><tbody><tr><td>CPT 認知處理治療</td><td>處理創傷信念、自責與事件意義</td><td>結構化認知練習與作業</td></tr><tr><td>PE 延長暴露治療</td><td>逐步接近安全但迴避的情境與記憶</td><td>共同規劃節奏、練習與負擔</td></tr><tr><td>EMDR 眼動減敏與歷程更新</td><td>依手冊處理目標記憶並搭配雙側刺激</td><td>受訓治療師與適當監督</td></tr></tbody></table></div><p>由VA/DoD支持；本網頁提供選擇資訊，不執行暴露或EMDR。依模式與需求安排療程，多重創傷可能需更長時間。[1,5]</p></details><h3>成人用藥安全檢核</h3><p class="note">選擇討論藥物者須完成以下檢核與醫師診斷確認；其他路徑僅顯示一般資訊。</p><div class="form-grid">${select('bipolar','躁症／輕躁症史或雙相疑慮',yesno)}${select('pregnant','懷孕／備孕／哺乳',yesno)}${select('renal','腎功能／透析狀態',[['','尚未確認'],['normal','CrCl ≥90 mL/min'],['mild','CrCl 60–89 mL/min'],['moderate','CrCl 30–59 mL/min'],['severe','CrCl <30 mL/min（非透析）'],['dialysis','血液透析']],'依仿單CrCl；eGFR未必能直接替代，AKI／腹膜透析須個別核對。')}${select('liver','肝功能（Child-Pugh）',[['','尚未確認'],['normal','無已知肝功能不全'],['mild','輕度 A（5–6分）'],['moderate','中度 B（7–9分）'],['severe','重度 C（10–15分）']])}${select('interaction','過敏與交互作用核對',[['','尚未核對'],['clear','已核對，無相關禁忌／重大交互作用'],['problem','有過敏或重大交互作用待處理']],'完整藥單與近期停藥史，含MAOI、linezolid、methylene blue、tramadol、抗凝血與其他血清素藥物。')}${select('bp','目前血壓',[['','尚未確認'],['normal','正常／高血壓已控制'],['high','高血壓未控制'],['low','低血壓或易低血壓']])}${select('nightmares','反覆惡夢且有困擾',yesno)}${select('orthostasis','姿勢性頭暈／暈厥或高跌倒風險',yesno)}${select('med','希望比較的藥物',[['','先共同討論 sertraline'],['sertraline','Sertraline'],['paroxetine','Paroxetine（速放）'],['venlafaxine','Venlafaxine XR']])}</div><div class="divider"></div>${p.drug?`<div class="drug"><span>供醫師確認的劑量參考</span><h3>${p.drug.name}</h3><p>${esc(p.drug.reason)}</p><dl>${[['起始',p.drug.start],['範圍與上限',p.drug.range],['調整',p.drug.titrate],['監測',p.drug.monitor]].map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl><p class="note">為指引／所引美國仿單參考，須核對台灣實際品項。不是自動處方；不得合併三種選項服用。[6–9]</p></div>`:callout('info','目前未產生個別化藥物劑量','依上方治療方向，完成診斷確認、偏好與用藥安全檢核後才提供參考。')}${p.warnings.length?`<h3>此個案需注意</h3>${list(p.warnings)}`:''}${callout('warn','避免常規使用','不建議以benzodiazepine或cannabis治療PTSD；不要自行停用既有鎮靜藥，必要時另行規劃漸減。Prazosin僅討論惡夢，不作整體PTSD治療。[1,6]')}<details><summary>台灣適應症與健保</summary><p>美國FDA已核准sertraline、paroxetine用於PTSD；venlafaxine及prazosin的PTSD用途屬仿單外。[6] 台灣適應症、劑型與給付須按最新TFDA品項仿單、健保規定及院內藥品核對，本工具不自動宣稱符合給付。</p></details>${next(3,'下一步：建立追蹤')}</section>`;}
function chart(){if(!records.length)return '<p class="empty">尚無資料。新增第一筆評估後呈現症狀趨勢。</p>';const r=[...records].sort((a,b)=>a.date.localeCompare(b.date)),start=Date.parse(r[0].date),span=Date.parse(r.at(-1).date)-start,x=i=>r.length===1?300:70+(Date.parse(r[i].date)-start)/span*470,y=v=>205-v/80*170;return `<svg viewBox="0 0 600 255" role="img" aria-label="PCL-5追蹤趨勢；橫軸依實際日期間隔，縱軸0至80分，資料詳見下表。">${[0,20,40,60,80].map(v=>`<line x1="55" y1="${y(v)}" x2="560" y2="${y(v)}" stroke="#dae3e8"/><text x="38" y="${y(v)+5}" text-anchor="end">${v}</text>`).join('')}<polyline points="${r.map((a,i)=>`${x(i)},${y(a.pcl)}`).join(' ')}" fill="none" stroke="#23746f" stroke-width="3"/>${r.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a.pcl)}" r="5" fill="#23746f"><title>${a.date}：${a.pcl}分</title></circle>`).join('')}<text x="70" y="240">${r[0].date}</text><text x="555" y="240" text-anchor="end">${r.length>1?r.at(-1).date:''}</text></svg>`;}
function fInput(name,label,type,attrs='',help=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" ${attrs}>${help?`<small>${help}</small>`:''}</div>`;}
function fSelect(name,label,xs){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" required>${options(xs,'')}</select></div>`;}
function followup(){if(!["adult","older"].includes(s.age))return `<section class="panel"><h2>追蹤評估</h2>${callout("warn","請先確認成人追蹤路徑",s.age?"此為兒少個案，不套用成人PCL-5門檻；請由兒少專科使用年齡適切工具並規劃追蹤。":"請先在安全與背景選擇年齡族群，再建立適用的追蹤評估。")}${next(0,"返回安全與背景")}</section>`;const f=E.followup(records);return `<section class="panel"><h2>追蹤評估</h2><p class="intro">以相同事件與量表版本，記錄症狀、功能與安全。</p>${callout('info','建議門診節奏（依個案調整）','起始／改藥後1–2週檢視安全與耐受性；治療期間每2–4週評估症狀與功能，約8–12週回顧足夠療程反應。高風險者須更早、更頻繁；穩定後共同安排維持與復發預防，不以分數自動停藥。')}<form id="follow-form"><div class="form-grid">${fInput('date','評估日期','date',`max="${today()}" value="${today()}" required`)}${fInput('pcl','正式 PCL-5 總分（0–80）','number','min="0" max="80" step="1" required','每次固定回顧期間；本流程建議過去1個月。未測量請勿填0。')}${fInput('function','功能受損（0–10）','number','min="0" max="10" step="1" required','0＝無受損，10＝嚴重受損；為自訂追蹤項目。')}${fInput('nightmare','每週惡夢天數（選填）','number','min="0" max="7" step="1"')}${fInput('weeks','目前療程已進行幾週','number','min="0" max="520" step="1" value="0" required')}${fSelect('adequate','足夠劑量／療程與依從性已確認？',[['','請評估'],['no','尚未／依從性待改善'],['yes','醫師已確認足夠治療']])}${fSelect('risk','本次安全狀態',risks)}${fSelect('side','副作用／不良反應',[['','請評估'],['none','無明顯副作用'],['mild','有困擾，需醫師檢視'],['serious','疑似嚴重反應／躁化／暈厥']])}</div><div id="follow-error" class="form-error" role="alert"></div><div class="actions"><button type="submit" class="btn primary">＋ 新增追蹤紀錄</button></div></form><div class="divider"></div><h3>PCL-5 症狀趨勢</h3>${chart()}${callout(f.tone,f.title,f.text)}${f.delta!==undefined&&records.length>1?`<p class="delta">較首筆基準${f.delta>=0?'下降':'上升'} <b>${Math.abs(f.delta)}</b> 分（基準 − 最新）</p>`:''}<p class="note">下降10分為反應參考，並非保證緩解；安全、功能與個人目標須一併確認。31–33分不是所有族群通用的診斷界線。[4]</p>${records.length?`<div class="table-wrap"><table><caption>追蹤紀錄（功能分數越高代表受損越重）</caption><thead><tr><th>日期</th><th>PCL-5</th><th>功能</th><th>惡夢／週</th><th>安全與副作用</th><th>操作</th></tr></thead><tbody>${records.map(a=>`<tr><td>${esc(a.date)}</td><td>${a.pcl}</td><td>${a.function}/10</td><td>${a.nightmare===''?'未填':esc(a.nightmare)}</td><td>${esc(riskLabel(a.risk))}<br><small>${a.side==='serious'?'疑似嚴重反應':a.side==='mild'?'有副作用':'無明顯副作用'}</small></td><td><button class="text-btn" data-delete="${esc(a.date)}">刪除</button></td></tr>`).join('')}</tbody></table></div><button class="btn" id="export-csv">匯出追蹤 CSV</button>`:''}<details><summary>反應不佳與復發預防</summary><p>改善時確認功能、目標及殘餘症狀，維持有效治療。反應不佳時核對診斷、持續威脅、共病、睡眠、物質使用、依從性、劑量及心理治療品質，討論優化或轉換。</p><p>結束療程前共同記錄早期警訊、壓力事件、支持資源、危機應對與再就醫方式。減藥須個別安排，不能由單一分數決定。</p></details></section>`;}
const refs=[['VA/DoD 2023｜PTSD 與急性壓力疾患指引','https://www.healthquality.va.gov/guidelines/mh/ptsd/','主要成人臨床決策依據；2023版本。'],['NICE NG116｜Post-traumatic stress disorder','https://www.nice.org.uk/guidance/ng116/chapter/recommendations','早期介入、兒少與服務協調。'],['VA｜DSM-5／DSM-5-TR 條件摘要','https://www.ptsd.va.gov/professional/treat/essentials/dsm5_ptsd.asp','診斷條件提示；正式診斷須完整訪談。'],['VA｜PCL-5 評估與變化解讀','https://www.ptsd.va.gov/professional/assessment/adult-sr/ptsd-checklist.asp','正式量表、總分及反應參考。'],['VA｜PTSD 心理治療總覽','https://www.ptsd.va.gov/professional/treat/txessentials/overview_therapy.asp','CPT、PE、EMDR及其他療法。'],['VA｜PTSD 藥物治療指引','https://www.ptsd.va.gov/professional/treat/txessentials/clinician_guide_meds.asp','推薦、惡夢處理與證據限制。'],['DailyMed｜Sertraline 仿單','https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=7d598f1a-6c76-458a-a155-7a6a0743a2d3&type=display','PTSD起始25mg；腎肝功能與滴定。'],['DailyMed｜Paroxetine 速放仿單','https://www.dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=25182b68-8f7a-48e8-9788-6818b0984b29','PTSD上限50mg；高齡／重度腎病上限40mg。'],['DailyMed｜Venlafaxine XR 仿單','https://www.dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=67059969-e291-4609-b130-0faacf2a19f0&type=display','CrCl及透析調整、血壓、肝功能提醒。']];
function references(){return `<section class="panel"><h2>指引與說明</h2><p class="intro">讓每個臨床推論與治療選擇，都有可追溯的依據。</p><p>內容查核：2026-11-12。供臨床人員教育與決策輔助，未驗證為醫療器材，不取代專業診斷、處方或緊急評估。成人為主；兒少、周產期、雙相與重大肝病轉入專科路徑。</p>${refs.map(([t,url,desc],i)=>`<div class="reference"><span>${String(i+1).padStart(2,'0')}</span><div><a href="${url}" target="_blank" rel="noopener">${t} ↗</a><p>${desc}</p></div></div>`).join('')}<h3>臨床規則</h3><ol class="body-list"><li>急迫安全風險優先於所有評分。</li><li>事件與症狀時間分開；未滿一個月不診斷PTSD，不以PTSD症狀群診斷ASD。</li><li>未評估不當作陰性；PCL-5高分不能取代創傷、四症狀群、時間、功能及排除條件。</li><li>須醫師確認診斷、病人偏好與完整用藥安全檢核，才產生藥物劑量參考。</li><li>門診頻率與8週提醒為可調整的實務流程；分數反應不等於緩解。</li></ol><h3>資料與隱私</h3><p>本程式僅在瀏覽器處理填寫資料，不上傳到伺服器。預設不跨次儲存，勾選「本機保留」才儲存於目前瀏覽器；清除瀏覽資料、無痕或更換裝置可能失去紀錄。共用電腦請勿保留，勿輸入姓名、病歷號等個資；匯出檔須妥善保管。</p><p>目前一次管理一份評估；每次換病人請選「新評估／清除」。8個示範病例均為虛構，載入會清空目前表單及追蹤，避免混用。</p></section>`;}
function rail(){const d=E.diagnose(s);return `<aside class="rail"><section class="panel route"><h2>評估路徑</h2><ol>${[['確認安全','辨識風險，建立安全基礎。'],['建立診斷','釐清創傷、症狀、時間與功能。'],['共同選擇治療','整合實證、偏好及個別風險。'],['量測並追蹤','追蹤症狀與功能，調整照護。']].map(([t,desc],i)=>`<li class="${i===page?'current':''}"><span>${i+1}</span><div><b>${t}</b><p>${desc}</p></div></li>`).join('')}</ol><div class="divider"></div><h3>證據來源</h3><p><b>VA/DoD 2023</b><br>PTSD／急性壓力疾患</p><p><b>NICE NG116</b><br>早期介入與兒少照護</p><button class="text-btn" data-nav="6">閱讀依據與適用限制 →</button></section><section class="mini-status"><span>目前診斷方向</span><h3>${d.title}</h3><p>${records.length} 筆追蹤 · ${saving?'已啟用本機保留':'目前未跨次儲存'}</p></section></aside>`;}
const caseLabels={age:{child:'6歲以下',young:'7–17歲',adult:'成人',older:'65歲以上'},event:{accident:'交通事故',violence:'人際暴力',disaster:'災難',medical:'醫療事件',work:'職務暴露',loss:'親友遭遇',other:'其他事件'}};
function caseTags(x){const t=[caseLabels.age[x.age],caseLabels.event[x.event]];const f=[[x.risk==='imminent','自傷計畫'],[x.risk==='unsafe','持續受暴'],[x.risk==='ideation','自傷想法'],[x.duration!=='long','症狀未滿1個月'],[x.excluded==='no','其他原因待排除'],[x.renal==='severe','CrCl<30'],[x.renal==='dialysis','血液透析'],[['mild','moderate','severe'].includes(x.liver),'肝功能不全'],[x.pregnant==='yes','懷孕'],[x.bipolar==='yes','疑似雙相'],[x.bp==='high','高血壓未控制'],[x.bp==='low','低血壓'],[x.nightmares==='yes','惡夢'],[x.comorbid.includes('substance'),'物質使用'],[x.comorbid.includes('dissociation'),'解離'],[x.prior==='failed','治療反應不佳'],[x.preference==='med','偏好藥物'],[x.preference==='therapy','偏好心理治療'],[x.preference==='combined','心理＋藥物'],[x.med==='venlafaxine','venlafaxine']];return [...t,...f.filter(a=>a[0]).map(a=>a[1])].filter(Boolean);}
function casePlan(x){const p=E.plan(x),first=t=>t.split(/[；。]/)[0];const w=p.warnings.filter(t=>!t.startsWith('起始或調整抗憂鬱劑'));return (p.drug?'可討論 '+p.drug.name:'')+(p.drug&&w.length?'；':'')+(w.length?first(w[0]):'');}
function caseTarget(code){return ['urgent','priority'].includes(code)?0:['acute','differential','subthreshold','child','incomplete','other'].includes(code)?1:2;}
function caseGallery(){const card=i=>{const [t,,lesson]=E.cases[i],x=E.example(i),d=E.diagnose(x),go=caseTarget(d.code),branches=Learning.caseBranches[i]||[],name=id=>{for(const r of Learning.tree){const c=r.children.find(c=>c.id===id);if(c)return c.title;}return id;};return `<article class="case-card ${demoIndex===i?'current':''}" id="case-${i+1}"><div class="case-head"><span class="case-no">${String(i+1).padStart(2,'0')}</span><h3>${esc(t)}</h3>${demoIndex===i?'<em class="case-current">目前載入</em>':''}</div><p class="case-story">${esc(E.cases[i][3])}</p><div class="case-tags">${caseTags(x).map(g=>`<span>${esc(g)}</span>`).join('')}${x.pcl!==''?`<span class="pcl">PCL-5 ${x.pcl}</span>`:''}</div><p class="case-lesson"><b>學習重點</b>${esc(lesson)}</p><p class="case-result ${d.tone}"><b>工具判讀</b>${esc(d.title)}${d.code==='probable'?`<span class="case-plan">${esc(casePlan(x))}</span>`:''}</p><div class="case-map">${branches.map(id=>`<button type="button" class="map-case" data-case-branch="${id}">心智圖：${esc(name(id))}</button>`).join('')}</div><button type="button" class="btn primary case-load" data-case-load="${i}" data-case-go="${go}">載入並前往${pages[go]} →</button></article>`;};
return `<section class="panel learning-panel"><h2>示範病例 16 例</h2><p class="intro">全部為虛構個案。先讀病人說明，想一想再看學習重點與工具判讀，再載入走完整流程；載入會清空目前表單與追蹤。</p>${[['核心情境','診斷條件、早期反應、腎病透析、緊急風險、兒少與雙相',0,8],['進階情境','周產期、肝病、血壓、共病、治療無效、受暴、鑑別與延遲症狀',8,16]].map(([g,desc,a,b])=>`<h3 class="case-group">${g}<small>${desc}</small></h3><div class="case-grid">${Array.from({length:b-a},(_,k)=>card(a+k)).join('')}</div>`).join('')}</section>`;}
function render(focus){document.title='PTSD 臨床導航｜診斷・治療・追蹤';$('app').innerHTML=`<a class="skip" href="#main">跳至主要內容</a><aside class="sidebar"><div class="brand">PTSD 臨床導航<small>臨床決策支援系統</small></div><nav aria-label="主要導覽">${navOrder.map((i,k)=>`<button data-nav="${i}" class="nav-item ${page===i?'active':''}" ${page===i?'aria-current="page"':''}><span class="nav-number">${k<7?String(k+1).padStart(2,'0'):'↗'}</span>${pages[i]}${i===7?'<em class="nav-badge">16</em>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><p>每一步，朝向復原。</p><span>VA/DoD 2023 · NICE NG116<br>內容查核 2026.11.12</span></div></aside><div class="workspace"><header class="topbar"><b>臨床決策支援</b><div><button id="export" class="btn">↓ 匯出摘要</button><button id="reset" class="text-btn">新評估／清除</button></div></header><main id="main"><div class="heading"><h1 id="page-title" tabindex="-1">PTSD 臨床導航</h1><p>從安全評估，走向持續復原。</p></div><div class="utility"><label for="demo">示範病例</label><select id="demo"><option value="">選擇虛構病例，快速體驗</option>${[['核心情境 1–8',0,8],['進階情境 9–16',8,16]].map(([g,a,b])=>`<optgroup label="${g}">${E.cases.slice(a,b).map(([t],k)=>`<option value="${a+k}" title="${esc(E.cases[a+k][3])}">${a+k+1}. ${esc(t)}</option>`).join('')}</optgroup>`).join('')}</select><button class="text-btn demo-all" data-nav="7">瀏覽全部16例病例卡 →</button><label class="check-row local"><input id="save-local" type="checkbox" ${saving?'checked':''}>本機保留評估與追蹤</label></div>${notice?`<div class="toast" role="status">${esc(notice)}</div>`:''}${demoIndex!==null&&page<4?`<aside class="demo-patient" aria-label="目前示範病人"><div><b>示範病人 ${demoIndex+1}｜${esc(E.cases[demoIndex][0])}</b><p>${esc(E.cases[demoIndex][3])}</p></div><button class="text-btn" data-nav="7">換一個病例 →</button></aside>`:''}<nav class="stepper" aria-label="評估步驟">${pages.slice(0,4).map((t,i)=>`<button data-nav="${i}" class="${page===i?'selected':''}"><span>${i+1}</span>${t}</button>`).join('')}</nav><div class="layout">${[safety,diagnosis,therapy,followup,quiz,mindmap,references,caseGallery][page]()}${page===4||page===5||page===7?learningRail():rail()}</div></main><footer>ⓘ　本工具供臨床輔助，診斷及處方須由醫師確認。請勿填入病人識別資料。</footer></div>`;bind();if(focus)$(focus)?.focus({preventScroll:true});}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function ask(message){return new Promise(resolve=>{const d=document.createElement('dialog');d.className='confirm-dialog';d.setAttribute('aria-labelledby','confirm-title');d.innerHTML='<h2 id="confirm-title">確認操作</h2><p></p><div class="actions"><button class="btn" data-answer="cancel">取消</button><button class="btn primary" data-answer="continue">確認繼續</button></div>';d.querySelector('p').textContent=message;const finish=value=>{d.close();d.remove();resolve(value);};d.querySelector('[data-answer="cancel"]').onclick=()=>finish(false);d.querySelector('[data-answer="continue"]').onclick=()=>finish(true);d.oncancel=e=>{e.preventDefault();finish(false);};document.body.append(d);d.showModal();d.querySelector('[data-answer="cancel"]').focus();});}
function summary(){const d=E.diagnose(s),p=E.plan(s);return ['PTSD 臨床導航｜臨床輔助摘要','產生日期：'+today(),'內容查核：2026-11-12','診斷方向：'+d.title,d.text,'安全：'+riskLabel(s.risk),'醫師確認：'+(s.confirmed?'已勾選':'未勾選'),'PCL-5：'+(s.pcl===''?'未測量':s.pcl),'共同目標：'+(s.goal||'未填'),'治療方向：',...p.psych,...p.warnings,...(p.drug?[p.drug.name,p.drug.start,p.drug.range,p.drug.titrate,p.drug.monitor]:['尚未產生個別化藥物劑量']),'追蹤紀錄：',...records.map(r=>`${r.date} | PCL-5 ${r.pcl} | 功能受損${r.function}/10 | ${riskLabel(r.risk)} | 副作用${r.side}`),'最新追蹤建議：'+E.followup(records).title,E.followup(records).text,'本摘要不取代臨床診斷或處方。'].join('\n');}
async function loadDemo(i){if(!await ask('載入虛構病例「'+E.cases[i][0]+'」將清空目前表單及追蹤，避免不同個案混用。繼續？'))return false;s=E.example(i);demoIndex=i;records=[];notice='目前為虛構示範：'+E.cases[i][0]+'｜學習重點：'+E.cases[i][2];save();render();return true;}
function bind(){
bindLearning();
if($('follow-form')){
const alert=document.createElement('div');alert.id='follow-safety';$('follow-form').prepend(alert);
const updateSafety=()=>{const r=$('f-risk').value,side=$('f-side').value;alert.innerHTML=['imminent','violence','withdrawal'].includes(r)?callout('danger','立即啟動緊急評估','不要等待填完整份追蹤表；依院內流程安排緊急醫療，維持安全與陪伴。'):['ideation','unsafe'].includes(r)?callout('danger','當日完整安全評估','先處理安全與保護需求；若無法確保安全，安排急診。'):side==='serious'?callout('danger','疑似嚴重反應，立即醫療評估','不要等待填表或下次回診，聯繫醫師安排緊急評估。'):'';};
$('f-risk').onchange=updateSafety;$('f-side').onchange=updateSafety;
}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.nav)));
document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const value=el.type==='checkbox'?el.checked:el.value;if(el.type==='number'&&value!==''&&!el.checkValidity()){el.reportValidity();return;}const key=el.dataset.field;s[key]=value;if(['age','event','exposure','elapsed','duration','impairment','excluded'].includes(key))s.confirmed=false;save();render(el.id);});
document.querySelectorAll('[data-symptom]').forEach(el=>el.onchange=()=>{s.symptoms[Number(el.dataset.symptom)]=el.value;s.confirmed=false;save();render(el.id);});
document.querySelectorAll('[data-comorbid]').forEach(el=>el.onchange=()=>{s.comorbid=el.checked?[...s.comorbid,el.dataset.comorbid]:s.comorbid.filter(x=>x!==el.dataset.comorbid);save();});
$('save-local').onchange=e=>{saving=e.target.checked;notice=saving?'已在此瀏覽器啟用本機保留，共用電腦請勿使用。':'已停用並移除跨次保留；本頁仍可繼續使用。';if(!saving)try{localStorage.removeItem(KEY);}catch{notice='無法移除本機資料，請於瀏覽器設定清除此網站資料。';}save();render('save-local');};
$('reset').onclick=async()=>{if(!await ask('清除目前表單、追蹤與本機保留，開始新評估？請先匯出需要的摘要。'))return;s=E.defaults();demoIndex=null;records=[];saving=false;try{localStorage.removeItem(KEY);}catch{}notice='已開始新的空白評估。';navigate(0);};
$('demo').onchange=async e=>{if(e.target.value==='')return;if(!await loadDemo(Number(e.target.value)))e.target.value='';};
document.querySelectorAll('[data-case-load]').forEach(b=>b.onclick=async()=>{if(await loadDemo(Number(b.dataset.caseLoad)))navigate(Number(b.dataset.caseGo));});
document.querySelectorAll('[data-case-branch]').forEach(b=>b.onclick=()=>{navigate(5);gotoNode(b.dataset.caseBranch);});
$('export').onclick=()=>download('PTSD-summary-'+today()+'.txt',summary(),'text/plain;charset=utf-8');
if($('follow-form'))$('follow-form').onsubmit=event=>{event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const a=Object.fromEntries(new FormData(form));if(a.date>today()||!/^\d{4}-\d{2}-\d{2}$/.test(a.date)){$('follow-error').textContent='請填寫有效日期，不可晚於今天。';return;}if(records.some(x=>x.date===a.date)){$('follow-error').textContent='此日期已有紀錄；先刪除原筆後再重新填寫。';return;}for(const k of ['pcl','function','weeks'])a[k]=Number(a[k]);if(a.nightmare!=='')a.nightmare=Number(a.nightmare);records.push(a);records.sort((x,y)=>x.date.localeCompare(y.date));notice='已新增'+a.date+'的追蹤評估。';save();render();};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!await ask('刪除'+b.dataset.delete+'的追蹤紀錄？'))return;records=records.filter(x=>x.date!==b.dataset.delete);save();render();});
if($('export-csv'))$('export-csv').onclick=()=>{const rows=[['日期','PCL-5','功能受損0-10','惡夢天數','療程週數','足夠治療已確認','安全','副作用'],...records.map(r=>[r.date,r.pcl,r.function,r.nightmare,r.weeks,r.adequate,riskLabel(r.risk),r.side])];download('PTSD-followup-'+today()+'.csv','\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');};
}
window.addEventListener('hashchange',()=>{const i=hashes.indexOf(location.hash.slice(1));if(i>=0&&i!==page){page=i;render();window.scrollTo(0,0);}});const initial=hashes.indexOf(location.hash.slice(1));if(initial>=0)page=initial;render();

</script></body></html>
